# Nginx configuration for Windows Update caching
# This configuration caches Microsoft Windows Updates to reduce bandwidth usage

user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

http {
    ##
    # Basic Settings
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging Settings
    ##
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss;

    ##
    # Cache Settings
    ##
    proxy_cache_path /nginx/www levels=1:2 keys_zone=wucache:500m max_size=100g inactive=365d use_temp_path=off;
    proxy_temp_path /nginx/www/tmp;

    ##
    # Upstream servers
    ##
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 10s;

    ##
    # Windows Update Cache Server
    ##
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Maximum body size for large update files
        client_max_body_size 0;
        
        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # Microsoft Update Catalog
        location ~ ^/.*\.(cab|exe|psf|msi|msp|msu)$ {
            proxy_pass http://$host$request_uri;
            proxy_cache wucache;
            proxy_cache_key $scheme://$host$request_uri;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 1d;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Windows Update endpoints - Microsoft domains
        location ~ ^.*$ {
            set $upstream_endpoint $host;
            proxy_pass http://$upstream_endpoint$request_uri;
            
            # Cache Microsoft update domains
            proxy_cache wucache;
            proxy_cache_key $scheme://$host$request_uri;
            proxy_cache_valid 200 365d;
            proxy_cache_valid 404 1d;
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Cache status endpoint
        location /cache-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow ::1;
            deny all;
        }
    }
}
